<div class="flex items-center justify-between mb-6">
  <h1 class="text-xl font-semibold text-gray-900">Users</h1>
  <button
    type="button"
    (click)="toggleForm()"
    class="inline-flex items-center px-4 py-2 rounded-md bg-gray-900 text-white text-sm font-medium hover:bg-gray-700 cursor-pointer"
  >
    {{ showForm() ? 'Cancel' : 'New user' }}
  </button>
</div>

@if (showForm()) {
  <form
    (ngSubmit)="submit()"
    #f="ngForm"
    class="mb-8 bg-white border border-gray-200 rounded-lg p-6 max-w-md"
  >
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Full name</label>
      <input
        type="text"
        name="fullName"
        [(ngModel)]="fullName"
        required
        class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-gray-900"
      />
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-gray-900"
      />
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Initial password</label>
      <input
        type="password"
        name="initialPassword"
        [(ngModel)]="initialPassword"
        required
        minlength="10"
        class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-gray-900"
      />
      <p class="mt-1 text-xs text-gray-500">At least 10 characters. Tip: use Reset password afterwards to have them choose their own.</p>
    </div>
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
      <select
        name="role"
        [(ngModel)]="role"
        class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-gray-900"
      >
        @for (r of roles; track r) {
          <option [value]="r">{{ r }}</option>
        }
      </select>
    </div>

    @if (errorMessage()) {
      <p class="text-sm text-red-600 mb-4">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      [disabled]="f.invalid || submitting()"
      class="w-full px-4 py-2 rounded-md bg-gray-900 text-white text-sm font-medium hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
    >
      {{ submitting() ? 'Creating...' : 'Create user' }}
    </button>
  </form>
}

<app-user-manager #manager [currentUserId]="currentUserId" />
