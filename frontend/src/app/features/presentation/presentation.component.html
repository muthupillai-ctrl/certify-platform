<div class="h-dvh flex flex-col bg-[#0B1222]">
  <header class="shrink-0 flex flex-wrap items-center justify-between gap-x-4 gap-y-2 px-4 sm:px-6 py-3 bg-[#15223B] border-b border-white/10">
    <a routerLink="/" class="flex items-center gap-2.5 min-w-0">
      <span class="w-8 h-8 rounded-full bg-[#7a2331] flex items-center justify-center shrink-0 shadow-[inset_0_0_0_1.5px_#dcae4a]">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#dcae4a" stroke-width="1.6" class="w-[15px] h-[15px]" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
      </span>
      <span class="text-[17px] font-semibold text-[#F7F5F0]">Certyfi</span>
      <span class="hidden sm:inline text-xs text-[#9FB0C9]">by Ahamsys</span>
    </a>
    <nav class="flex flex-wrap items-center gap-2" aria-label="Sign in">
      <a href="mailto:info@ahamsys.com?subject=Certyfi" class="px-3 py-1.5 text-sm text-[#C9D3E3] hover:text-white underline-offset-4 hover:underline" title="info@ahamsys.com · +234 706 289 1305">Contact</a>
      <a routerLink="/verify"
        class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-lg bg-white/10 text-sm font-medium text-[#F7F5F0] ring-1 ring-inset ring-white/15 hover:bg-white/20">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 text-[#7FD49B]" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
        </svg>
        Verify a certificate
      </a>
      @if (auth.currentUser()) {
        <a routerLink="/admin" class="px-4 py-1.5 rounded-lg bg-[#D97A2B] text-sm font-semibold text-[#15223B] hover:bg-[#E8A765]">Go to the app</a>
      } @else {
        <a routerLink="/login" class="px-4 py-1.5 rounded-lg bg-[#D97A2B] text-sm font-semibold text-[#15223B] hover:bg-[#E8A765]">Institution login</a>
      }
      <a routerLink="/platform/login" class="px-4 py-1.5 rounded-lg border border-[#9FB0C9]/60 text-sm font-medium text-[#F7F5F0] hover:bg-white/10">Platform login</a>
    </nav>
  </header>
  <iframe src="/assets/presentation/index.html" title="Certyfi: what we're building (presentation)" class="grow w-full border-0" loading="eager"></iframe>
</div>
