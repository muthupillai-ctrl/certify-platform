# Serves the Angular build inside the certyfi-frontend container.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html must never be cached, or browsers keep loading an old
    # build's hashed bundle names after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The service worker (offline verify app) must always be re-checked, or
    # browsers keep running the previous build after a deploy. no-store, not
    # no-cache: Cloudflare caches .js files by default and rewrites no-cache
    # to its 4-hour browser TTL, but always honours no-store.
    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
