# /data/reverse-proxy/nginx/conf.d/certyfi.conf on the box (shared
# reverse-proxy container). TLS ends at Cloudflare; this listens on plain 80.
#
# Upstreams are resolved through Docker DNS at request time (resolver +
# variable), same as montessori360: if Certyfi's containers are down, only
# certyfi.ahamsys.com returns 502 — the shared proxy still starts and every
# other site keeps working.

server {
    listen 80;
    server_name certyfi.ahamsys.com;

    resolver 127.0.0.11 valid=30s;
    # Background-image uploads go up to UploadsController's own limit.
    client_max_body_size 10m;

    location /api/ {
        set $certyfi_backend http://certyfi-backend:8080;
        proxy_pass $certyfi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Always https: the site is only reachable through Cloudflare, which
        # redirects http to https. $scheme here would be the internal "http".
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Uploaded images are served by the API as static files.
    location /uploads/ {
        set $certyfi_backend http://certyfi-backend:8080;
        proxy_pass $certyfi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        set $certyfi_backend http://certyfi-backend:8080;
        proxy_pass $certyfi_backend;
    }

    # Private presentation (see AccessController): the /presentation page
    # and the presentation file need a pass (a cookie from /access); without
    # one, /presentation redirects to the mobile-number page and the file is
    # refused. Everything else (the landing page at /, verification, logins,
    # the Partner API) is open. no-store keeps Cloudflare and browsers from
    # caching either for others.
    location = /presentation {
        auth_request /_home_access;
        error_page 401 = @home_gate;
        add_header Cache-Control "no-store" always;
        set $certyfi_frontend http://certyfi-frontend:80;
        proxy_pass $certyfi_frontend;
        proxy_set_header Host $host;
    }

    location ^~ /assets/presentation/ {
        auth_request /_home_access;
        add_header Cache-Control "private, no-store" always;
        set $certyfi_frontend http://certyfi-frontend:80;
        proxy_pass $certyfi_frontend;
        proxy_set_header Host $host;
    }

    location = /_home_access {
        internal;
        set $certyfi_backend http://certyfi-backend:8080;
        proxy_pass $certyfi_backend/api/v1/access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @home_gate {
        absolute_redirect off;
        add_header Cache-Control "no-store" always;
        return 302 /access;
    }

    location / {
        set $certyfi_frontend http://certyfi-frontend:80;
        proxy_pass $certyfi_frontend;
        proxy_set_header Host $host;
    }
}
