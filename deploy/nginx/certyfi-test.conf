# /data/reverse-proxy/nginx/conf.d/certyfi-test.conf on the box (shared
# reverse-proxy container): Certyfi's TEST system. TLS ends at Cloudflare;
# this listens on plain 80 like the other sites. Kept out of search engines.
server {
    listen 80;
    server_name certyfi.onnurendu.shop;

    resolver 127.0.0.11 valid=30s;
    client_max_body_size 10m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Catch-all inbox (password-protected by Mailpit itself).
    location /mail/ {
        set $certyfi_test_mail http://certyfi-test-mailpit:8025;
        proxy_pass $certyfi_test_mail;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        set $certyfi_test_frontend http://certyfi-test-frontend:80;
        proxy_pass $certyfi_test_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
