# Deploy layout on muthu-linux (pwms-server):
#   /data/apps/certyfi/
#     compose.yaml               <- this file
#     .env.production            <- real secrets, chmod 600, NOT committed (see .env.production.example)
#     backend/                   <- rsynced backend/ (src/ + Certyfi.sln), built here
#     frontend/www/              <- built Angular dist, rsynced from a dev machine
#     frontend/nginx.conf        <- deploy/nginx/certyfi-frontend.conf
#
# No container publishes a public port. The host's shared reverse-proxy
# container reaches certyfi-backend and certyfi-frontend by name on
# apps-network (see deploy/nginx/certyfi.conf). The frontend has its own
# small nginx container so deploying Certyfi never requires recreating the
# shared reverse-proxy (and briefly taking every other site down) just to
# add a bind mount.

services:
  certyfi-postgres:
    image: postgres:16-alpine
    container_name: certyfi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: certyfi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: certyfi
    # Loopback only: reachable from the box itself (and via an SSH tunnel),
    # not from the rest of the LAN. 5432-5435 are taken by other apps.
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - certyfi_pgdata:/var/lib/postgresql/data
    networks:
      - apps-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certyfi -d certyfi"]
      interval: 10s
      timeout: 5s
      retries: 5

  certyfi-backend:
    build:
      context: ./backend
      dockerfile: src/Certyfi.Api/Dockerfile
    image: certyfi-backend:latest
    container_name: certyfi-backend
    restart: unless-stopped
    depends_on:
      certyfi-postgres:
        condition: service_healthy
    env_file:
      - .env.production
    expose:
      - "8080"
    volumes:
      # Uploaded template background images (UploadsController). Without
      # this they'd live in the container and vanish on every rebuild.
      - certyfi_uploads:/app/wwwroot/uploads
    networks:
      - apps-network

  certyfi-frontend:
    image: nginx:alpine
    container_name: certyfi-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/www:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - apps-network

networks:
  apps-network:
    external: true

volumes:
  certyfi_pgdata:
  certyfi_uploads:
