# The TEST system, on pwms-server: the same containers as production
# (deploy/compose.yaml), with its own database, keys and a catch-all inbox.
#   Web:    https://certyfi.onnurendu.shop   (shows a "TEST SYSTEM" banner)
#   Inbox:  https://certyfi.onnurendu.shop/mail/   (password; every email it sends)
#   DB:     127.0.0.1:5437 on the server
#
# Layout on the server, /data/apps/certyfi-test/:
#   compose.yaml        <- this file
#   .env.test           <- the test system's own secrets, chmod 600
#   mailpit-auth        <- inbox login (htpasswd, bcrypt), chmod 600
#   backend/            <- rsynced backend/, built here
#   frontend/www/       <- built Angular app
#   frontend/nginx.conf <- deploy/test/nginx.conf
# No public ports: the shared reverse-proxy reaches the frontend and the
# inbox by name on apps-network (deploy/nginx/certyfi-test.conf).
# Deploy with: scripts/deploy.sh test

name: certyfi-test

services:
  certyfi-test-postgres:
    image: postgres:16-alpine
    container_name: certyfi-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: certyfi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: certyfi
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - certyfi_test_pgdata:/var/lib/postgresql/data
    networks:
      - apps-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certyfi -d certyfi"]
      interval: 10s
      timeout: 5s
      retries: 5

  certyfi-test-backend:
    build:
      context: ./backend
      dockerfile: src/Certyfi.Api/Dockerfile
    image: certyfi-backend:test
    container_name: certyfi-test-backend
    restart: unless-stopped
    depends_on:
      certyfi-test-postgres:
        condition: service_healthy
    env_file:
      - .env.test
    expose:
      - "8080"
    volumes:
      - certyfi_test_uploads:/app/wwwroot/uploads
    networks:
      - apps-network

  certyfi-test-frontend:
    image: nginx:alpine
    container_name: certyfi-test-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/www:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - apps-network

  # Catch-all inbox: the test system never emails anyone real. Its page is
  # at /mail/ behind a password (mailpit-auth), since the server is public.
  certyfi-test-mailpit:
    image: axllent/mailpit:latest
    container_name: certyfi-test-mailpit
    restart: unless-stopped
    environment:
      MP_WEBROOT: mail
      MP_UI_AUTH_FILE: /auth/mailpit-auth
      MP_MAX_MESSAGES: "5000"
    volumes:
      - ./mailpit-auth:/auth/mailpit-auth:ro
    expose:
      - "8025"
      - "1025"
    networks:
      - apps-network

networks:
  apps-network:
    external: true

volumes:
  certyfi_test_pgdata:
  certyfi_test_uploads:
