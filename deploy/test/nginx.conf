# Test system's frontend container (deploy/test/compose.yaml): the
# app, plus /api and /uploads passed to the backend. The shared
# reverse-proxy sends everything for the test address here
# (deploy/nginx/certyfi-test.conf). Upstreams resolve at request time, so
# this starts even while the backend is down.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $backend http://certyfi-test-backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Reached only through Cloudflare (https).
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        set $backend http://certyfi-test-backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        set $backend http://certyfi-test-backend:8080;
        proxy_pass $backend;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
